configuration:
  network_key:
    name: Network Key
    description: "ZigBee network encryption key (32 hex characters). See README for instructions on capturing this from your ViCare network."
  capture:
    name: Capture Settings
    description: Configure how ViLocal receives ZigBee packets
    fields:
      source:
        name: Capture Source
        description: "ember-sniff connects to an Ember packet stream. tcpdump reads packets from a local interface. whsniff captures traffic on a ZigBee channel."
      interface:
        name: Interface / Path
        description: "Use a serial or TCP path for ember-sniff (e.g., /dev/ttyUSB0 or tcp://192.168.1.42:6638) or a local interface name for tcpdump (e.g., enx001fee00295e). whsniff uses the channel setting."
      channel:
        name: Channel
        description: "ZigBee channel to sniff with ember-sniff or whsniff (11–26)."
  mqtt:
    name: MQTT Settings
    description: Configure MQTT broker connection for publishing device attributes
    fields:
      url:
        name: Broker URL
        description: "MQTT broker connection URL (e.g., mqtt://core-mosquitto:1883 if using Home Assistant add-on like Mosquitto, mqtt://192.168.1.10:1883 for external broker)"
      username:
        name: Username
        description: MQTT broker username
      password:
        name: Password
        description: MQTT broker password
      topic:
        name: Topic
        description: Base topic for publishing device attributes
      device_discovery_prefix:
        name: Discovery Prefix
        description: "Home Assistant MQTT Discovery prefix (default: homeassistant)"
  control:
    name: Thermostat Control
    description: "Optionally control ViCare thermostats from Home Assistant. Control requires an adapter with EmberZNet (NCP) firmware paired to your ViCare network as a repeater. You can share an EmberZNet capture adapter or use a dedicated control adapter. See the Documentation tab for setup."
    fields:
      enabled:
        name: Enable Control
        description: "Forward thermostat commands to the ViCare network. Leave disabled to monitor devices only."
      dedicated_interface:
        name: Dedicated Control Interface / Path
        description: "Optional serial/TCP path of a second ember-router adapter for control (e.g., tcp://192.168.1.43:6638). Leave empty to share the paired capture adapter with ember-sniff. In shared mode, capture pauses briefly while a command is sent and Home Assistant shows requested radiator setpoints immediately."
  thermostats:
    name: Thermostats
    description: "Configure known ViCare thermostats with their serial numbers and optional associated climate sensors"
    fields:
      serial_no:
        name: Serial Number
        description: "Device serial number / EUI-64 ID (format: AB-CD-EF-12-34-56-78-90). Find in ViCare app device settings."
      name:
        name: Name
        description: "Human-readable name for this thermostat (e.g., Bedroom)"
      entity_id:
        name: Entity ID
        description: "Optional Home Assistant entity id slug (without domain). Defaults to a slug generated from Name, e.g. Gäste WC -> gaste_wc"
      suggested_area:
        name: Suggested Area
        description: "Optional Home Assistant area/room for this device"
      climate_sensor_serial_no:
        name: Climate Sensor
        description: "Optional: Serial number of associated climate sensor for better temperature/humidity readings"
  floor_thermostats:
    name: Floor Thermostats
    description: "Add one entry for each ViCare floor heating zone you want to see in Home Assistant."
    fields:
      serial_no:
        name: Controller Serial Number
        description: "Serial number or EUI-64 of the floor heating controller. Use the same serial number for zones on the same controller."
      endpoint:
        name: Zigbee Endpoint
        description: "Endpoint number of the zone on the controller (1–240)."
      name:
        name: Name
        description: "Name of the zone in Home Assistant, such as Bathroom Floor Heating."
      entity_id:
        name: Entity ID
        description: "Optional Home Assistant entity ID slug without the domain. Defaults to a slug generated from the name. Use a unique slug for each zone."
      suggested_area:
        name: Suggested Area
        description: "Optional Home Assistant area for the zone."
      climate_sensor_serial_no:
        name: Climate Sensor Serial Number
        description: "Optional serial number of a ViCare climate sensor to display the room temperature and humidity."
  climate_sensors:
    name: Climate Sensors
    description: "Configure known ViCare climate (temperature/humidity) sensors"
    fields:
      serial_no:
        name: Serial Number
        description: "Device serial number / EUI-64 ID (format: FF-EE-DD-CC-BB-AA-00-00). Find in ViCare app device settings."
      name:
        name: Name
        description: "Human-readable name for this climate sensor"
      entity_id:
        name: Entity ID
        description: "Optional Home Assistant entity id slug (without domain). Defaults to a slug generated from Name, e.g. Gäste WC -> gaste_wc"
      suggested_area:
        name: Suggested Area
        description: "Optional Home Assistant area/room for this device"
  advanced:
    name: Advanced Settings
    description: "Optional advanced controls for packet decoding and logging"
    fields:
      language:
        name: Language
        description: "Controls the language of default device and entity names only. Choose en for English (default) or de for German. This setting will be removed when ViLocal can use the Home Assistant instance language automatically."
      publish_unknown_devices:
        name: Publish Unknown Devices
        description: "Automatically discover unlisted radiator thermostats and climate sensors. Add floor heating zones under Floor Thermostats."
      filter_pan_id:
        name: Filter PAN-ID
        description: "Optional filter for a specific ZigBee network / PAN (Personal Area Network) ID. Only packets from this network will be processed. Format: 4 hex characters (e.g., 1A2B). Leave empty for no filtering."
      retain_state:
        name: Retain State
        description: "Retain the last known state of all published devices in the MQTT broker"
      buffer_format:
        name: Buffer Format
        description: "Encoding format used for binary payloads published to MQTT"
      unwrap_layers:
        name: Unwrap Layers
        description: "Protocol layers to unwrap before ZigBee decoding (eth, ip4, ip6, tcp, udp, zep). Leave empty for direct IEEE 802.15.4 input."
      add_cli_args:
        name: Additional Capture CLI Arguments
        description: "Optional extra flags appended to the selected capture tool (examples: tcpdump: -n -vvv -s 0, ember-sniff: -v -P 10)."
      control_add_cli_args:
        name: Additional Control CLI Arguments
        description: "Optional flags for ember-router, such as -v. Use -m to supply a different pairing manufacturer code. The default is UBISYS_TECHNOLOGIES_GMBH."
      router_keepalive_minutes:
        name: Shared Router Keepalive (minutes)
        description: "Send a check-in to Vitoconnect before capture starts and after this many minutes without a control request in shared adapter mode. Defaults to 60 minutes. Set to 0 to disable. Periodic check-ins briefly pause capture."
      log_level:
        name: Log Level
        description: "ViLocal log verbosity"
